name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Static policy validation
        run: make validate

  admission-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install pinned policy engines
        run: |
          policy_bin="${RUNNER_TEMP}/policy-bin"
          mkdir -p "$policy_bin"
          curl -fsSL https://github.com/open-policy-agent/opa/releases/download/v1.8.0/opa_linux_amd64_static -o ${policy_bin}/opa
          echo "1359b1bff233fc0a290066e864c75b8158e52756319757b6854df467fe7fc146  ${policy_bin}/opa" | sha256sum -c -
          chmod +x ${policy_bin}/opa
          curl -fsSL https://github.com/kyverno/kyverno/releases/download/v1.15.2/kyverno-cli_v1.15.2_linux_x86_64.tar.gz -o /tmp/kyverno.tar.gz
          echo "c90520ba24fb8b8df003ec22d6d2621e4a3d3c7497665fdcf84e9eab4ff1dfe0  /tmp/kyverno.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kyverno.tar.gz -C "$policy_bin" kyverno
          echo "$policy_bin" >> "$GITHUB_PATH"
      - name: Test admission behavior
        run: make policy-test

  image-policy-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
