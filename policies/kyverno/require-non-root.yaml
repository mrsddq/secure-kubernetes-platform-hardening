apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-pod-run-as-non-root
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        message: Pods must run as non-root.
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
    - name: disallow-container-root-override
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        message: Container security contexts must not override non-root execution.
        foreach:
          - list: request.object.spec.[containers, initContainers, ephemeralContainers][]
            pattern:
              =(securityContext):
                =(runAsNonRoot): true
                =(runAsUser): ">0"
