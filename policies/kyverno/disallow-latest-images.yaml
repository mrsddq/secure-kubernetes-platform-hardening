apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-images
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-digest
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        message: All containers must reference an image by its sha256 digest; tags are mutable.
        foreach:
          - list: request.object.spec.[containers, initContainers, ephemeralContainers][]
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('^[^@]+@sha256:[a-f0-9]{64}$', element.image) }}"
                    operator: Equals
                    value: false
